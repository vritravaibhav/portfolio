<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Divyanshu Vaibhav — Software Engineer building Spring Boot microservices, Flutter clients, and hardware-accelerated Android Native (NDK/JNI) systems.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Divyanshu Vaibhav">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">

  <!-- Favicon. The ?v= query busts both the browser's favicon cache and the
       Flutter service worker, which otherwise keep serving the old icon. Bump
       it if the icon art ever changes again. -->
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=2">

  <title>Divyanshu Vaibhav · Software Engineer</title>
  <meta name="theme-color" content="#0A0E1A">
  <link rel="manifest" href="manifest.json">

  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>

<body>
  <script>
    window.addEventListener('load', function (ev) {
      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: "{{flutter_service_worker_version}}",
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('flutter-first-frame', function () {
        navigator.serviceWorker.register('flutter_service_worker.js?v=2330050811');
      });
    }
  </script>
  <script src="main.dart.js" type="application/javascript"></script>

</body>

</html>
